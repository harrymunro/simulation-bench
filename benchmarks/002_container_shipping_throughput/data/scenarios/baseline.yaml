scenario_id: baseline
description: Baseline Asia-to-Europe container service over a 180-day planning horizon

simulation:
  horizon_days: 180
  replications: 30
  base_random_seed: 20260603
  warmup_days: 14

routing:
  objective: shortest_time
  allow_cape_reroute: true
  canal_capacity_enabled: true

production:
  objective: maximise_teu_to_rotterdam
  load_ports:
    - CNSHA
    - SGSIN
  deliver_to: NLRTM

dispatching:
  policy: return_to_home_port
  tie_breaker: shortest_expected_cycle_time

stochasticity:
  handling_time_distribution: normal_truncated
  leg_time_noise_cv: 0.10

fleet:
  vessel_count: 12
